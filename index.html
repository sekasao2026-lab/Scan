<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จุดตรวจประตู - โรงเรียนเซกา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--pri:#42A5F5;--pri-d:#1565C0;--pri-l:#E3F2FD;--yel:#FFF9C4;--yel-d:#F9A825;
--ok:#2E7D32;--ok-l:#E8F5E9;--bad:#E53935;--bad-l:#FFEBEE;--warn:#E65100;--warn-l:#FFF3E0;--mut:#78909C;--line:#E3F2FD}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif}
body{background:linear-gradient(135deg,#FFF9C4 0%,#F1F8FF 50%,#BBDEFB 100%) fixed;min-height:100vh;color:#263238;font-size:16px}
h1,h2,h3,h4{font-family:'Prompt','Sarabun',sans-serif}
.hero{background:linear-gradient(120deg,#FFF3B0,#FFF9C4 40%,#BBDEFB);text-align:center;
 padding:calc(16px + env(safe-area-inset-top)) 16px 50px;border-radius:0 0 50% 50%/0 0 34px 34px;box-shadow:0 6px 18px rgba(66,165,245,.15)}
.hero h1{font-size:21px;color:var(--pri-d);line-height:1.3}
.hero p{font-size:14px;color:var(--yel-d);font-weight:700;margin-top:2px}
.wrap{max-width:560px;margin:-28px auto 30px;padding:0 12px;position:relative;z-index:2}
.card{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 10px 28px rgba(66,165,245,.14);margin-bottom:14px}
label{display:block;font-size:15px;font-weight:600;color:#455A64;margin-bottom:6px}
input{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;
 font-size:17px;background:#FAFAFA;margin-bottom:14px;outline:none;font-family:inherit}
input:focus{border-color:#64B5F6;background:#fff;box-shadow:0 0 0 4px rgba(100,181,246,.18)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
 padding:12px 18px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;
 font-family:'Prompt','Sarabun',sans-serif;margin-top:10px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.b-pri{background:linear-gradient(135deg,#64B5F6,#42A5F5,#1E88E5);color:#fff;box-shadow:0 6px 16px rgba(30,136,229,.3)}
.b-ok{background:linear-gradient(135deg,#81C784,#43A047);color:#fff;box-shadow:0 6px 16px rgba(67,160,71,.3)}
.b-back{background:linear-gradient(135deg,#64B5F6,#1E88E5);color:#fff}
.b-soft{background:var(--pri-l);color:var(--pri-d)}
.b-stop{background:var(--bad-l);color:var(--bad)}
.b-gray{background:#ECEFF1;color:#546E7A}
.b-force{background:linear-gradient(135deg,#FFB74D,#E65100);color:#fff;box-shadow:0 6px 16px rgba(230,81,0,.3)}
.big{min-height:70px;font-size:21px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--yel);
 border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600;color:var(--pri-d)}
.logout{background:var(--bad-l);color:var(--bad);border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
#reader{width:100%;border-radius:18px;overflow:hidden;background:#263238}
#reader video{width:100%!important;display:block}
#reader img[alt="Info icon"]{display:none}
.cam-msg{text-align:center;color:var(--mut);font-size:15px;margin:10px 0 0;min-height:22px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:#90A4AE;font-size:13px}
.or:before,.or:after{content:'';flex:1;height:1px;background:#CFD8DC}
.sec-h{color:var(--pri-d);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sec-h button{width:auto;min-height:40px;margin:0;padding:6px 14px;font-size:14px}
.out-item{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:15px;cursor:pointer;background:#fff}
.out-item:active{background:var(--pri-l)}
.out-item.late{border-color:#EF9A9A;background:var(--bad-l)}
.out-item b{color:var(--pri-d)}.out-item.late b{color:#C62828}
.tap{font-size:12px;color:var(--pri);text-align:right;margin-top:2px}
.tag{display:inline-block;background:var(--pri-l);color:var(--pri-d);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.etag{display:inline-block;background:var(--bad-l);color:#C62828;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:18px;border:2px dashed var(--line);border-radius:14px;margin-top:10px}
.err{color:var(--bad);text-align:center;font-size:14px;margin-top:10px;min-height:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(38,50,56,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;
 border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:48px;height:5px;background:#CFD8DC;border-radius:9px;margin:0 auto 14px}
.banner{border-radius:18px;padding:16px;text-align:center;margin-bottom:14px}
.banner .ico{font-size:40px;line-height:1}
.banner .t{font-family:'Prompt','Sarabun';font-size:21px;font-weight:700;margin-top:4px}
.banner .s{font-size:15px;margin-top:2px}
.bn-leave{background:var(--ok-l);color:var(--ok);border:2px solid #A5D6A7}
.bn-return{background:var(--pri-l);color:var(--pri-d);border:2px solid #90CAF9}
.bn-warn{background:var(--warn-l);color:var(--warn);border:2px solid #FFCC80}
.bn-bad{background:var(--bad-l);color:#C62828;border:2px solid #EF9A9A}
.bn-done{background:var(--ok-l);color:var(--ok);border:2px solid #A5D6A7}
.idcheck{background:#FFF8E1;border:2px dashed #FFB300;color:#6D4C41;border-radius:14px;padding:10px 12px;font-weight:700;text-align:center;margin-bottom:12px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.who .nm{font-family:'Prompt','Sarabun';font-size:21px;font-weight:700;color:#263238}
.sid{background:var(--yel);color:#6D4C41;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.info{font-size:16px;line-height:1.9;color:#455A64;background:#FAFCFF;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.plate{display:inline-block;background:#263238;color:#FFEB3B;border-radius:8px;padding:0 10px;font-weight:700;letter-spacing:.5px}
.info a{color:var(--pri-d);font-weight:700;text-decoration:none}
.spin{width:44px;height:44px;border:5px solid var(--pri-l);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:26px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
 .pw{position:relative}
.pw input{padding-right:58px}
.eye{position:absolute;right:6px;top:5px;width:46px;height:42px;border:none;background:transparent;font-size:20px;cursor:pointer;border-radius:10px}
.eye:active{background:var(--pri-l)}
.rem{display:flex;align-items:flex-start;gap:10px;font-weight:500;font-size:15px;margin:-2px 0 8px;cursor:pointer;line-height:1.5}
.rem input{width:22px;height:22px;min-height:0;flex:0 0 22px;margin:2px 0 0;padding:0;accent-color:var(--pri)}
.rem small{color:var(--mut);font-size:13px}
</style>
</head>
<body>

<header class="hero">
  <h1>🚪 จุดตรวจประตู — บันทึกเข้า-ออก</h1>
  <p id="schoolLine">โรงเรียนเซกา จังหวัดบึงกาฬ</p>
</header>

<div class="wrap">

    <div class="card" id="loginBox">
    <h2 style="color:var(--pri-d);font-size:22px;margin-bottom:4px;">เข้าสู่ระบบ</h2>
    <p class="sub" style="margin-bottom:14px;">สำหรับ ยาม/รปภ. • ครูงานกิจการนักเรียน • หัวหน้างานกิจการนักเรียน</p>
    <form id="loginForm" autocomplete="on" onsubmit="event.preventDefault(); doLogin();">
      <label for="u">เลขประจำตัวประชาชน</label>
      <input type="text" id="u" name="username" autocomplete="username" inputmode="numeric" placeholder="เลขประจำตัวประชาชน 13 หลัก">
      <label for="p">รหัสผ่าน</label>
      <div class="pw">
        <input type="password" id="p" name="password" autocomplete="current-password" placeholder="รหัสผ่าน">
        <button type="button" class="eye" onclick="togglePw(this)" aria-label="แสดงรหัสผ่าน">👁️</button>
      </div>
      <label class="rem">
        <input type="checkbox" id="rem">
        <span>จดจำการเข้าสู่ระบบในเครื่องนี้ 30 วัน<br><small>เครื่องประจำป้อมที่ใช้หลายคน — กด "ออก" ทุกครั้งเมื่อเปลี่ยนกะ</small></span>
      </label>
      <button type="submit" class="btn b-pri">🔐 เข้าสู่ระบบ</button>
    </form>
    <p class="err" id="loginMsg"></p>
  </div>

  <div id="mainBox" style="display:none">
    <div class="card">
      <div class="topbar">
        <span id="who"></span>
        <button class="logout" onclick="doLogout()">ออก</button>
      </div>

      <div id="reader"></div>
      <p class="cam-msg" id="camMsg">กด "เปิดกล้อง" เพื่อเริ่มสแกน</p>

      <button class="btn b-pri big" id="btnStart" onclick="startCam()">📷 เปิดกล้องสแกน</button>
      <button class="btn b-stop" id="btnStop" style="display:none" onclick="stopCam()">ปิดกล้อง</button>

      <div class="or">หรือพิมพ์ค้นหา (นักเรียนไม่มีโทรศัพท์)</div>
      <input type="text" id="manual" placeholder="รหัสใต้ QR / รหัสนักเรียน / ชื่อ" style="margin-bottom:0"
             onkeydown="if(event.key==='Enter')manualLookup()">
      <button class="btn b-soft" onclick="manualLookup()">🔍 ค้นหา</button>
    </div>

    <div class="card">
      <div class="sec-h">
        <span>📋 รอบันทึกออก <span class="tag" id="readyCount">0</span></span>
        <button class="btn b-soft" onclick="loadLists()">🔄</button>
      </div>
      <div id="readyList"></div>
    </div>

    <div class="card">
      <div class="sec-h">
        <span>🚶 ยังอยู่นอกบริเวณ <span class="tag" id="outCount">0</span></span>
      </div>
      <div id="outList"></div>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<script>
/* ========== ค่าตั้งต้น (โรงเรียนเซกา) — ⚠️ ตรวจ 2 บรรทัดนี้ให้ตรงกับของเดิม ========== */
var API_URL = 'https://script.google.com/macros/s/AKfycbyEoXZ5cO0hgl9D3pnqW1eu0lxby0OSAh62MjvwBIGa_9Y7pgl4C-Zl1JPzsP56qpsFMg/exec';
var SECRET  = 'seka2569xyz';
/* ================================================================================ */

/* ---------- ตั้งค่าจากลิงก์ที่แอดมินส่งให้ (…/scan/#c=...) ----------
   เปิดลิงก์ครั้งเดียว เครื่องจะจำที่อยู่ระบบ + รหัสลับ + ชื่อโรงเรียนไว้
   หน้าเดียวนี้จึงใช้ได้กับทุกโรงเรียนที่ทำสำเนาระบบไป */
var CFG_KEY = 'gateCfg', CFG = null;
(function loadCfg(){
  try { CFG = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e){ CFG = null; }
  var m = location.hash.match(/[#&]c=([A-Za-z0-9_-]+)/);
  if (m) {
    try {
      var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var c = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      if (c && c.k && /^https:\/\/script\.google\.com\/\S+\/exec$/.test(c.u)) {
        if (!CFG || CFG.u !== c.u) {             // เปลี่ยนระบบ → ล้างการเข้าสู่ระบบของระบบเดิม
          ['guardUser', 'guardRemember', 'guardLastUser'].forEach(function(k){ localStorage.removeItem(k); });
        }
        localStorage.setItem(CFG_KEY, JSON.stringify(c));
        CFG = c;
      }
    } catch(e){}
    history.replaceState(null, '', location.pathname + location.search);   // ซ่อนรหัสลับออกจากแถบที่อยู่
  }
  if (CFG && CFG.u && CFG.k) { API_URL = CFG.u; SECRET = CFG.k; }
})();
// เปิดลิงก์ตั้งค่าในแท็บที่เปิดหน้านี้อยู่แล้ว → โหลดใหม่ให้ค่าใหม่มีผล
window.addEventListener('hashchange', function(){ if (/[#&]c=/.test(location.hash)) location.reload(); });

function showSchool(){
  if (!CFG || !CFG.n) return;
  document.getElementById('schoolLine').innerText = CFG.n + (CFG.a ? ' ' + CFG.a : '');
  document.title = 'จุดตรวจประตู - ' + CFG.n;
}

var guard = null, scanner = null, found = null, busy = false, outTimer = null;
var lists = { ready: [], out: [], pick: [] };

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- จดจำการเข้าสู่ระบบ ---------- */
var REM_KEY = 'guardRemember', LAST_KEY = 'guardLastUser';

function getRem(){
  try { var v = JSON.parse(localStorage.getItem(REM_KEY) || 'null'); return (v && v.u && v.t) ? v : null; }
  catch(e){ return null; }
}
function setRem(u, t){ localStorage.setItem(REM_KEY, JSON.stringify({ u:u, t:t })); }
function clearRem(){ localStorage.removeItem(REM_KEY); }

// สั่งให้ Chrome / บัญชี Google ถามบันทึกรหัสผ่าน
function savePw(u, p, name){
  try {
    if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
      navigator.credentials.store(new PasswordCredential({ id:String(u), password:String(p), name:name || String(u) }))
        .catch(function(){});
    }
  } catch(e){}
}
 
function togglePw(btn){
  var el = document.getElementById('p');
  var show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.innerText = show ? '🙈' : '👁️';
  btn.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  el.focus();
}

// เข้าระบบใหม่ด้วยบัตรผ่าน (ไม่ต้องพิมพ์รหัส)
function relogin(rm, done){
  fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'remember', username:rm.u, token:rm.t, secret:SECRET }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res && res.success) {
        guard = res;
        localStorage.setItem('guardUser', JSON.stringify(res));
        done(true);
      } else {
        clearRem();
        done(false);
      }
    })
    .catch(function(){ done(false); });
}

window.onload = function(){
  showSchool();
  var lu = localStorage.getItem(LAST_KEY);
  if (lu) {
    document.getElementById('u').value = lu;
    document.getElementById('rem').checked = true;
  }

  var s = localStorage.getItem('guardUser');
  if (s) {
    var g = JSON.parse(s);
    if (g.token) { guard = g; showMain(); return; }
    localStorage.removeItem('guardUser');
  }

  var rm = getRem();
  if (!rm) return;
  var m = document.getElementById('loginMsg');
  m.style.color = '#78909C';
  m.innerText = '⏳ กำลังเข้าสู่ระบบอัตโนมัติ...';
  relogin(rm, function(ok){
    m.innerText = '';
    if (ok) showMain();
  });
};

function expiredOut(msg){
  document.getElementById('sheetBg').classList.remove('show');
  busy = false;
  alert(msg);
  doLogout();
}

function api(payload, cb, errCb){
  payload.secret = SECRET;
  if (guard && guard.token) payload.sess = guard.token;
  fetch(API_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res && res.expired) {
        // จดจำไว้ → เข้าใหม่เงียบ ๆ แล้วส่งคำสั่งเดิมซ้ำ 1 ครั้ง
        var rm = getRem();
        if (rm && !payload._retried) {
          relogin(rm, function(ok){
            if (!ok) { expiredOut(res.message); return; }
            payload._retried = true;
            api(payload, cb, errCb);
          });
          return;
        }
        expiredOut(res.message);
        return;
      }
      cb(res);
    })
    .catch(function(e){ if (errCb) errCb(e); });
}

/* ---------- Login ---------- */
function doLogin(){
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value.trim();
  var remember = document.getElementById('rem').checked;
  var m = document.getElementById('loginMsg');
  if (!u || !p) { m.innerText = 'กรุณากรอกให้ครบ'; return; }
  m.style.color = '#78909C'; m.innerText = '⏳ กำลังตรวจสอบ...';
  api({action:'login', username:u, password:p, remember:remember}, function(res){
    if (!res.success) {
      m.style.color = '#E53935';
      m.innerText = res.message + (/รหัสลับ/.test(res.message) ? '\nกรุณาขอ "ลิงก์หน้าสแกนสำหรับเครื่องยาม" จากแอดมินแล้วเปิดใหม่ 1 ครั้ง' : '');
      return;
    }
    if (remember) localStorage.setItem(LAST_KEY, u); else localStorage.removeItem(LAST_KEY);
    if (remember && res.remember) setRem(u, res.remember); else clearRem();
    delete res.remember;
       savePw(u, p, res.fullName);
    guard = res;
    localStorage.setItem('guardUser', JSON.stringify(res));
    m.innerText = '';
    showMain();
  }, function(e){ m.style.color = '#E53935'; m.innerText = '❌ เชื่อมต่อไม่ได้: ' + e; });
}

function showMain(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  document.getElementById('who').innerText = '👤 ' + guard.fullName;
  loadLists();
  if (outTimer) clearInterval(outTimer);
  outTimer = setInterval(function(){ if (!busy) loadLists(); }, 60000);
}

function doLogout(){
  var rm = getRem();
  if (rm) {
    fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'forget', username:rm.u, token:rm.t, secret:SECRET }) })
      .catch(function(){});
    clearRem();
  }
  stopCam();
  if (outTimer) clearInterval(outTimer);
  localStorage.removeItem('guardUser');
  guard = null;
  document.getElementById('mainBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('loginMsg').innerText = '';

  var lu = localStorage.getItem(LAST_KEY) || '';
  document.getElementById('u').value = lu;
  document.getElementById('rem').checked = !!lu;
  var pw = document.getElementById('p');
  pw.value = '';
  pw.type = 'password';
  var eye = document.querySelector('.eye');
  if (eye) eye.innerText = '👁️';
}

/* ---------- กล้อง ---------- */
function startCam(){
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'flex';
  setCamMsg('⏳ กำลังเปิดกล้อง...');
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode:'environment' },
    { fps:10, qrbox:function(w,h){ var s = Math.floor(Math.min(w,h) * 0.7); return { width:s, height:s }; } },
    onScan, function(){}
  ).then(function(){ setCamMsg('📷 เล็ง QR ให้อยู่ในกรอบ'); })
   .catch(function(e){ setCamMsg('<span style="color:#E53935">❌ เปิดกล้องไม่ได้: ' + esc(e) + '</span>'); stopCam(); });
}

function stopCam(){
  document.getElementById('btnStart').style.display = 'flex';
  document.getElementById('btnStop').style.display = 'none';
  setCamMsg('กด "เปิดกล้อง" เพื่อเริ่มสแกน');
  if (!scanner) return;
  var s = scanner; scanner = null;
  s.stop().then(function(){ s.clear(); }).catch(function(){});
}

function pauseCam(){ if (scanner) { try { scanner.pause(true); } catch(e){} } }
function resumeCam(){ if (scanner) { try { scanner.resume(); setCamMsg('📷 พร้อมสแกนคนถัดไป'); } catch(e){} } }
function setCamMsg(h){ document.getElementById('camMsg').innerHTML = h; }

function beep(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.frequency.value = 1200; o.connect(g); g.connect(ctx.destination);
    g.gain.value = 0.15; o.start(); setTimeout(function(){ o.stop(); ctx.close(); }, 120);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate(120);
}

function onScan(text){
  if (busy) return;
  busy = true;
  pauseCam();
  beep();
  setCamMsg('⏸️ หยุดสแกนชั่วคราว — รอยืนยัน');
  lookup(text);
}

/* ---------- ค้นหาด้วยพิมพ์ ---------- */
function manualLookup(){
  var t = document.getElementById('manual').value.trim();
  if (!t || busy) return;
  if (t.length < 2) { alert('พิมพ์อย่างน้อย 2 ตัวอักษร'); return; }
  busy = true;
  pauseCam();
  if (/^REQ\d+-/i.test(t)) lookup(t);
  else findStudent(t);
}

function findStudent(q){
  openSheet('<div class="spin"></div><p style="text-align:center;color:#78909C;">กำลังค้นหา "' + esc(q) + '"...</p>');
  api({action:'find', q:q}, function(res){
    var list = (res && res.list) || [];
    lists.pick = list;
    if (!list.length) {
      openSheet('<div class="banner bn-bad"><div class="ico">🔍</div><div class="t">ไม่พบ</div>' +
        '<div class="s">ไม่พบคำขอที่อนุมัติแล้วของ "' + esc(q) + '"</div></div>' +
        '<button class="btn b-pri big" onclick="closeSheet()">ปิด</button>');
      return;
    }
    if (list.length === 1) { openFound(list[0], true); return; }
    var h = '<h3 style="color:var(--pri-d);margin-bottom:6px;">พบ ' + list.length + ' รายการ — แตะเพื่อเลือก</h3>';
    list.forEach(function(r, i){
      h += '<div class="out-item" onclick="openFound(lists.pick[' + i + '],true)">' +
        '<b>' + esc(r.studentName) + '</b> <span class="tag">' + esc(r.classRoom) + '</span>' +
        (r.emergency ? ' <span class="etag">🆘 ฉุกเฉิน</span>' : '') +
        '<div class="sub">รหัส ' + esc(r.studentId) + ' | ' + esc(r.note) + ' | ขอออก ' + esc(r.planLeaveTime) + ' น.</div></div>';
    });
    h += '<button class="btn b-gray" onclick="closeSheet()">✕ ยกเลิก</button>';
    openSheet(h);
  }, function(e){
    openSheet('<div class="banner bn-bad"><div class="ico">📡</div><div class="t">เชื่อมต่อไม่ได้</div><div class="s">' + esc(e) + '</div></div>' +
      '<button class="btn b-pri big" onclick="closeSheet()">ลองใหม่</button>');
  });
}

/* ---------- หน้าต่างผล ---------- */
function openSheet(html){
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetBg').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetBg').classList.remove('show');
  document.getElementById('sheetBody').innerHTML = '';
  document.getElementById('manual').value = '';
  found = null;
  busy = false;
  resumeCam();
}

function lookup(token){
  openSheet('<div class="spin"></div><p style="text-align:center;color:#78909C;">กำลังตรวจสอบ...</p>');
  api({action:'lookup', token:token}, function(r){
    if (!r) return;
    if (!r.success) {
      found = null;
      openSheet('<div class="banner bn-bad"><div class="ico">⛔</div><div class="t">ใช้ไม่ได้</div>' +
        '<div class="s">' + esc(String(r.message).replace(/^❌\s*/, '')) + '</div></div>' +
        '<button class="btn b-pri big" onclick="closeSheet()">📷 สแกนใหม่</button>');
      return;
    }
    openFound(r, false);
  }, function(e){
    openSheet('<div class="banner bn-bad"><div class="ico">📡</div><div class="t">เชื่อมต่อไม่ได้</div><div class="s">' + esc(e) + '</div></div>' +
      '<button class="btn b-pri big" onclick="closeSheet()">ลองใหม่</button>');
  });
}

function openFromList(kind, i){
  if (busy) return;
  var r = lists[kind][i];
  if (!r) return;
  busy = true;
  pauseCam();
  openFound(r, true);
}

function openFound(r, bySearch){
  found = r;
  found._bySearch = !!bySearch;
  renderFound(found);
}

function renderFound(r){
  var x = r.extra || {};
  var sid = x.studentId || r.studentId || '';
  var tw = r.timeWarn;
  var banner, btn;

  if (r.action === 'leave' && tw) {
    banner = '<div class="banner bn-warn"><div class="ico">⏰</div><div class="t">' + esc(tw.why) + '</div><div class="s">' + esc(tw.note) + '</div></div>';
    btn = '<button class="btn b-force big" id="btnDo" onclick="doScan(\'leave\',\'' + esc(tw.why) + '\')">⚠️ บันทึกทั้งที่' + esc(tw.why) + '</button>';
  } else if (r.action === 'leave') {
    banner = '<div class="banner bn-leave"><div class="ico">🚶</div><div class="t">อนุญาตให้ออก</div><div class="s">' + esc(r.note || '') + '</div></div>';
    btn = '<button class="btn b-ok big" id="btnDo" onclick="doScan(\'leave\')">✅ ยืนยันบันทึกเวลาออก</button>';
  } else if (r.action === 'return') {
    banner = '<div class="banner bn-return"><div class="ico">🏫</div><div class="t">กลับเข้าโรงเรียน</div><div class="s">' + esc(r.note || '') + '</div></div>';
    btn = '<button class="btn b-back big" id="btnDo" onclick="doScan(\'return\')">✅ ยืนยันบันทึกเวลากลับ</button>';
  } else {
    banner = '<div class="banner bn-warn"><div class="ico">⚠️</div><div class="t">ไม่ต้องบันทึก</div><div class="s">' + esc(r.note || '') + '</div></div>';
    btn = '';
  }

  var back = (!r.planReturnTime || r.planReturnTime === 'ไม่กลับมา') ? 'ไม่กลับมา' : r.planReturnTime + ' น.';

  var info =
    '<div>📄 ' + esc(r.requestId) + '</div>' +
    '<div>📝 ' + esc(r.reasonText) + '</div>' +
    (r.destination ? '<div>📍 ' + esc(r.destination) + '</div>' : '') +
    '<div>🕐 ออก ' + esc(r.planLeaveTime) + ' น. | กลับ ' + esc(back) + '</div>' +
    (x.travelMethod ? '<div>🚗 ' + esc(x.travelMethod) + (x.travelDetail ? ' <span class="plate">' + esc(x.travelDetail) + '</span>' : '') + '</div>' : '') +
    (x.pickupName ? '<div>👤 ผู้มารับ ' + esc(x.pickupName) + (x.pickupRelation ? ' (' + esc(x.pickupRelation) + ')' : '') +
       (x.pickupPhone ? ' <a href="tel:' + esc(x.pickupPhone) + '">' + esc(x.pickupPhone) + '</a>' : '') + '</div>' : '') +
    (x.studentPhone ? '<div>📱 นักเรียน <a href="tel:' + esc(x.studentPhone) + '">' + esc(x.studentPhone) + '</a></div>' : '') +
    (r.companions && r.companions.length ? '<div>👥 ' + r.companions.map(function(c){ return esc(c); }).join(', ') + '</div>' : '') +
    (r.actualLeave ? '<div>⏱️ ออกจริง ' + esc(r.actualLeave) + '</div>' : '') +
    (r.actualReturn ? '<div>⏱️ กลับจริง ' + esc(r.actualReturn) + '</div>' : '');

  openSheet(banner +
    (r._bySearch && btn ? '<div class="idcheck">🪪 ไม่ได้สแกน QR — กรุณาตรวจบัตรนักเรียนให้ตรงตัวก่อนบันทึก</div>' : '') +
    '<div class="who"><span class="nm">' + esc(r.studentName) + '</span>' +
      '<span class="tag">' + esc(r.classRoom) + '</span>' +
      (sid ? '<span class="sid">รหัส ' + esc(sid) + '</span>' : '') +
      (r.emergency ? '<span class="etag">🆘 ฉุกเฉิน</span>' : '') + '</div>' +
    '<div class="info">' + info + '</div>' + btn +
    '<button class="btn b-gray" onclick="closeSheet()">' + (btn ? '✕ ยกเลิก' : '📷 สแกนคนถัดไป') + '</button>');
}

function doScan(type, force){
  if (!found) return;
  if (force && !confirm('⚠️ อยู่นอกช่วงเวลาที่อนุญาต (' + force + ')\n\nระบบจะบันทึกหมายเหตุและชื่อของท่านไว้\nยืนยันบันทึกหรือไม่?')) return;

  var b = document.getElementById('btnDo');
  if (b) { b.disabled = true; b.innerHTML = '⏳ กำลังบันทึก...'; }

  api({action:'scan', rowIndex:found.rowIndex, scanType:type, force:force || ''}, function(res){
    if (!res) return;
    if (!res.success) {
      if (b) { b.disabled = false; b.innerHTML = '🔁 ลองบันทึกอีกครั้ง'; }
      alert(res.message);
      return;
    }
    var name = found.studentName + ' (' + found.classRoom + ')';
    found = null;
    openSheet('<div class="banner bn-done"><div class="ico">✅</div><div class="t">บันทึกเรียบร้อย</div>' +
      '<div class="s">' + esc(name) + '<br>' + esc(String(res.message).replace(/^[✅🚶]\s*/, '')) + '</div></div>' +
      '<button class="btn b-pri big" onclick="closeSheet()">📷 คนถัดไป</button>');
    loadLists();
  }, function(e){
    if (b) { b.disabled = false; b.innerHTML = '🔁 ลองบันทึกอีกครั้ง'; }
    alert('❌ เชื่อมต่อไม่ได้: ' + e);
  });
}

/* ---------- รายการรอออก / ยังอยู่นอก ---------- */
function listHtml(kind, list, emptyText){
  if (!list.length) return '<div class="empty">' + emptyText + '</div>';
  return list.map(function(r, i){
    var sub = kind === 'out'
      ? 'ออก ' + esc(r.actualLeave) + ' | นัดกลับ ' + esc(r.planReturnTime) + ' น.'
      : 'ขอออก ' + esc(r.planLeaveTime) + ' น. — ' + esc(r.reasonText);
    return '<div class="out-item' + (r.late ? ' late' : '') + '" onclick="openFromList(\'' + kind + '\',' + i + ')">' +
      '<b>' + esc(r.studentName) + '</b> <span class="tag">' + esc(r.classRoom) + '</span>' +
      (r.emergency ? ' <span class="etag">🆘 ฉุกเฉิน</span>' : '') +
      (r.late ? ' <span class="etag">⚠️ เลยเวลา</span>' : '') +
      '<div class="sub">รหัส ' + esc(r.studentId) + ' | ' + sub + '</div>' +
      '<div class="tap">แตะเพื่อบันทึก ›</div></div>';
  }).join('');
}

function loadLists(){
  api({action:'lists'}, function(res){
    if (!res || !res.success) {
      document.getElementById('readyList').innerHTML = '<div class="empty" style="color:#E53935">❌ ' + esc(res ? res.message : '') + '</div>';
      return;
    }
    lists.ready = res.ready || [];
    lists.out = res.out || [];
    document.getElementById('readyCount').innerText = lists.ready.length;
    document.getElementById('outCount').innerText = lists.out.length;
    document.getElementById('readyList').innerHTML = listHtml('ready', lists.ready, '✅ ไม่มีรายการรอบันทึกออก');
    document.getElementById('outList').innerHTML = listHtml('out', lists.out, '✅ ไม่มีนักเรียนอยู่นอกบริเวณ');
  }, function(){
    document.getElementById('readyList').innerHTML = '<div class="empty" style="color:#E53935">❌ เชื่อมต่อไม่ได้</div>';
  });
}
</script>
